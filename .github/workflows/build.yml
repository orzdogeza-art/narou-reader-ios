name: Build iOS app (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode / Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project NarouReader.xcodeproj \
            -scheme NarouReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\* " || true
          test -d build/Build/Products/Release-iphoneos/NarouReader.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NarouReader.app Payload/
          zip -qr NarouReader.ipa Payload

      - name: Report compile errors as annotations
        if: always()
        run: |
          if [ -f build.log ]; then
            grep -E "\.swift:[0-9]+:[0-9]+: error:" build.log | sort -u | head -40 | while IFS= read -r line; do
              file=$(echo "$line" | sed -E 's/^(.*\.swift):([0-9]+):([0-9]+): error: (.*)$/\1/' | sed "s#^$PWD/##")
              ln=$(echo "$line" | sed -E 's/^(.*\.swift):([0-9]+):([0-9]+): error: (.*)$/\2/')
              msg=$(echo "$line" | sed -E 's/^(.*\.swift):([0-9]+):([0-9]+): error: (.*)$/\4/')
              echo "::error file=$file,line=$ln::$msg"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NarouReader-ipa
          path: NarouReader.ipa

      - name: Publish IPA as a release (public download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NarouReader.ipa \
            --title "最新ビルド (iPhone 用 IPA)" \
            --notes "Sideloadly で iPhone に入れるためのファイルです。署名なしのため、そのままでは入りません。"
